server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Retired/moved URLs — real HTTP 301s for crawlers and clients that don't
    # execute JS. Matches the client-side redirects in src/App.tsx. Must sit
    # above the SPA fallback below, which otherwise returns 200 for everything.
    location = /vision { return 301 /products; }
    location = /founder { return 301 /about; }
    location = /certifications { return 301 /training/certifications; }
    location = /bootcamps { return 301 /training/bootcamps; }
    location = /internships { return 301 /careers; }
    location ~ ^/course/(.+)$ { return 301 /training/courses/$1; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}